name: Bazel Build (QNX)
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_call:
  workflow_dispatch:
jobs:
  qnx-build:
    name: Build and Test ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: toolchain-qnx-tests-x86_64
            bazel-config: x86_64-qnx
            working-directory: "./tests/"
            bazel-target: "//:all_tests"
            bazel-disk-cache: toolchain-qnx-tests-x86_64
            bazel-test-target: >-
              //:all_tests
          - name: toolchain-qnx-tests-aarch64
            bazel-config: aarch64-qnx
            working-directory: "./tests/"
            bazel-target: "//:all_tests"
            bazel-disk-cache: toolchain-qnx-tests-aarch64
            bazel-test-target: >-
              //:all_tests
            extra-bazel-test-flags: "--test_timeout=120,600,1800,7200" # Increase test timeout due to QEMU emulation
    uses: eclipse-score/cicd-workflows/.github/workflows/qnx-build.yml@f606cc0c3fccd3e85dcc6d112f3f1f9aed7efdb8 # main on 2026-11-06
    permissions:
      contents: read
      pull-requests: read
    with:
      bazel-target: ${{ matrix.bazel-target }}
      bazel-config: ${{ matrix.bazel-config }}
      bazel-test-target: ${{ matrix.bazel-test-target }}
      test-log-artifact-name: qnx-testlogs-${{ matrix.bazel-disk-cache }}-${{ github.run_attempt }}
      credential-helper: ".github/tools/qnx_credential_helper.py"
      bazel-disk-cache: ${{ matrix.bazel-disk-cache }}
      working-directory: ${{ matrix.working-directory }}
      extra-bazel-test-flags: ${{ matrix.extra-bazel-test-flags }}
    secrets:
      score-qnx-license: ${{ secrets.SCORE_QNX_LICENSE }}
      score-qnx-user: ${{ secrets.SCORE_QNX_USER }}
      score-qnx-password: ${{ secrets.SCORE_QNX_PASSWORD }}
      qnx-sdp-github-token: ${{ secrets.SCORE_BOT_QNX_PKG_PAT }}
